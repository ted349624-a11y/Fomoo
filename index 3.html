<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOMORIANS — Whitelist</title>
<meta name="description" content="FOMORIANS whitelist. Every mint = 200,000 $FOMORIANS airdrop.">
<meta property="og:title" content="FOMORIANS — Whitelist">
<meta name="theme-color" content="#07021A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Sora:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">

<style>
:root{
  --void:#07021A;
  --cyan:#3CF2FF;
  --pink:#FF4FD8;
  --vio:#8B5CF6;
  --gold:#FFD66B;
  --txt:#EEF0FF;
  --mut:rgba(238,240,255,.55);
  --dim:rgba(238,240,255,.3);
  --red:#FF7A95;
}

*{box-sizing:border-box;margin:0;padding:0}
button,input{font-family:inherit}
html{-webkit-text-size-adjust:100%}

body{
  background:var(--void);
  color:var(--txt);
  font-family:'Sora',system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100dvh;
  overflow-x:hidden;
}

/* ================= WORLD ================= */
.world{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}

.sky{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 55% at 50% 62%, rgba(255,79,216,.25) 0%, transparent 60%),
    radial-gradient(ellipse 70% 45% at 50% 60%, rgba(139,92,246,.35) 0%, transparent 70%),
    linear-gradient(180deg,#07021A 0%,#140639 48%,#2A0A55 62%,#07021A 100%);
}

.floor{position:absolute;left:-50%;right:-50%;top:62%;height:120%;perspective:320px}

.grid{
  position:absolute;inset:0;
  transform:rotateX(72deg);transform-origin:top center;
  background-image:
    linear-gradient(rgba(60,242,255,.5) 1.5px,transparent 1.5px),
    linear-gradient(90deg,rgba(255,79,216,.4) 1.5px,transparent 1.5px);
  background-size:60px 60px;
  animation:run 1.8s linear infinite;
  -webkit-mask:linear-gradient(180deg,transparent 0%,#000 25%);
          mask:linear-gradient(180deg,transparent 0%,#000 25%);
}

@keyframes run{to{background-position:0 60px}}

.horizon{
  position:absolute;left:0;right:0;top:62%;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),var(--cyan),transparent);
  box-shadow:0 0 24px var(--cyan),0 0 60px var(--pink);
}

/* ================= PAGE ================= */
.wrap{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;
  padding:26px 16px 50px;
  display:flex;flex-direction:column;align-items:center;
}

.brand{
  font-family:'Unbounded',sans-serif;
  font-weight:800;
  font-size:clamp(24px,7vw,34px);
  letter-spacing:.03em;
  background:linear-gradient(90deg,var(--cyan) 0%,#fff 45%,var(--pink) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 16px rgba(60,242,255,.35));
  margin-bottom:4px;
}

.airline{
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);
  margin-bottom:26px;
  text-shadow:0 0 14px rgba(255,214,107,.5);
}

/* ================= TV ================= */
.tv{
  position:relative;
  width:100%;
  margin-top:8px;
}

/* antennas */


.ant-tip{
  position:absolute;top:-50px;
  width:10px;height:10px;border-radius:50%;
  background:var(--pink);
  box-shadow:0 0 12px var(--pink);
  z-index:2;
}

.ant-tip.l{left:calc(42% - 30px)}
.ant-tip.r{right:calc(42% - 30px);background:var(--cyan);box-shadow:0 0 12px var(--cyan)}

.bezel{
  position:relative;
  padding:16px 16px 58px;
  border-radius:30px;
  background:
    linear-gradient(160deg,#4a3a8f 0%,#2b1f5e 45%,#1a1240 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.18),
    inset 0 -6px 0 rgba(0,0,0,.35),
    0 30px 70px rgba(0,0,0,.6),
    0 0 60px rgba(139,92,246,.25);
  border:1px solid rgba(255,255,255,.1);
}

/* screen */
.screen{
  position:relative;
  height:min(560px,64dvh);
  min-height:420px;
  border-radius:22px / 26px;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 40%,#171046 0%,#0a0620 75%,#050212 100%);
  box-shadow:
    inset 0 0 0 3px #0d0826,
    inset 0 0 40px rgba(0,0,0,.9),
    inset 0 0 80px rgba(60,242,255,.08);
  display:flex;flex-direction:column;
}

/* CRT scanlines + vignette + flicker */
.screen::before{
  content:'';position:absolute;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}

.screen::after{
  content:'';position:absolute;inset:0;z-index:6;pointer-events:none;
  background:
    radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%),
    linear-gradient(180deg,rgba(255,255,255,.06) 0%,transparent 18%);
  animation:flicker 5s steps(1) infinite;
}

@keyframes flicker{
  0%,97%{opacity:1}
  98%{opacity:.85}
  99%{opacity:1}
}

/* status bar */
.status{
  position:relative;z-index:4;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;
  font-family:'VT323',monospace;
  font-size:18px;
  letter-spacing:.04em;
  color:var(--cyan);
  text-shadow:0 0 8px rgba(60,242,255,.6);
  border-bottom:1px solid rgba(60,242,255,.15);
  background:rgba(0,0,0,.25);
}

.status .rec{display:flex;align-items:center;gap:6px;color:var(--pink);text-shadow:0 0 8px rgba(255,79,216,.7)}
.status .rec i{width:8px;height:8px;border-radius:50%;background:var(--pink);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* chat */
.chat{
  position:relative;z-index:3;
  flex:1;
  overflow-y:auto;
  padding:18px 14px 10px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}

.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:rgba(60,242,255,.25);border-radius:4px}

.msg{
  display:flex;align-items:flex-end;gap:8px;
  margin-bottom:10px;
  animation:pop .28s ease-out;
}

@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}

.msg .av{
  flex:none;
  width:34px;height:34px;border-radius:12px;
  overflow:hidden;
  border:1px solid rgba(60,242,255,.45);
  box-shadow:0 0 12px rgba(60,242,255,.3);
}

.msg .av img{width:100%;height:100%;object-fit:cover;display:block}
.msg .av.ghost{visibility:hidden}

.bubble{
  max-width:82%;
  padding:11px 14px;
  font-size:14px;
  line-height:1.55;
  border-radius:18px;
  word-wrap:break-word;
}

.bot .bubble{
  background:rgba(139,92,246,.2);
  border:1px solid rgba(139,92,246,.4);
  border-bottom-left-radius:6px;
  color:var(--txt);
}

.bot .bubble b{color:var(--gold);font-weight:600}
.bot .bubble .hl{color:var(--cyan);font-weight:600}

.me{justify-content:flex-end}

.me .bubble{
  background:linear-gradient(135deg,var(--cyan),#7cc6ff);
  color:var(--void);
  font-weight:600;
  border-bottom-right-radius:6px;
  box-shadow:0 0 18px rgba(60,242,255,.3);
}

.bot.err .bubble{
  background:rgba(255,122,149,.14);
  border-color:rgba(255,122,149,.45);
}

/* typing dots */
.typing .bubble{display:flex;gap:5px;padding:14px 16px}
.typing .bubble span{
  width:7px;height:7px;border-radius:50%;
  background:var(--cyan);
  animation:dot 1s infinite ease-in-out;
}
.typing .bubble span:nth-child(2){animation-delay:.15s}
.typing .bubble span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

/* airdrop card inside chat */
.dropcard{
  margin-top:8px;
  padding:12px 12px;
  border-radius:14px;
  text-align:center;
  background:linear-gradient(135deg,rgba(255,214,107,.16),rgba(255,79,216,.12));
  border:1px solid rgba(255,214,107,.5);
}

.dropcard b{
  display:block;
  font-family:'Unbounded',sans-serif;
  font-size:18px;font-weight:800;
  color:var(--gold) !important;
  text-shadow:0 0 18px rgba(255,214,107,.55);
}

.dropcard small{font-size:11px;color:var(--mut)}

/* mission list inside bubble */
.missions{margin-top:10px;display:flex;flex-direction:column;gap:7px}

.mission{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;
  border-radius:12px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.08);
  transition:all .25s;
}

.mission .mi{
  flex:none;width:28px;height:28px;border-radius:9px;
  display:grid;place-items:center;font-size:13px;
  background:rgba(60,242,255,.1);border:1px solid rgba(60,242,255,.3);
}

.mission .mt{flex:1;font-size:13px;font-weight:500}

.mission button{
  flex:none;
  padding:6px 13px;border-radius:20px;
  font-size:12px;font-weight:600;
  color:var(--cyan);
  background:rgba(60,242,255,.1);
  border:1px solid rgba(60,242,255,.4);
  cursor:pointer;
}

.mission button:hover{background:rgba(60,242,255,.2)}

.mission.done{border-color:rgba(255,79,216,.45);background:rgba(255,79,216,.08)}
.mission.done .mi{background:var(--pink);border-color:var(--pink);color:var(--void);box-shadow:0 0 10px rgba(255,79,216,.6)}
.mission.done .mt{color:var(--mut);text-decoration:line-through}
.mission.done button{color:var(--pink);border-color:rgba(255,79,216,.4);background:transparent;cursor:default}

/* input dock */
.dock{
  position:relative;z-index:4;
  display:flex;gap:8px;
  padding:10px 12px 12px;
  border-top:1px solid rgba(60,242,255,.15);
  background:rgba(0,0,0,.35);
}

.dock .field{
  flex:1;min-width:0;
  display:flex;align-items:center;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  transition:border-color .2s, box-shadow .2s;
}

.dock .field:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(60,242,255,.12)}

.dock .pre{padding-left:13px;color:var(--cyan);font-weight:600;font-size:14px}

.dock input{
  flex:1;min-width:0;
  padding:12px 12px;
  font-size:14px;
  color:var(--txt);
  background:transparent;border:none;
}

.dock input::placeholder{color:var(--dim)}
.dock input:focus{outline:none}
.dock input:disabled{cursor:not-allowed}

.ok{
  flex:none;
  min-width:62px;
  padding:0 16px;
  border:none;border-radius:14px;
  font-family:'Unbounded',sans-serif;
  font-size:13px;font-weight:600;letter-spacing:.06em;
  color:var(--void);
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  cursor:pointer;
  box-shadow:0 0 18px rgba(60,242,255,.35);
  transition:transform .12s, filter .2s;
}

.ok:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}
.ok:disabled{background:rgba(255,255,255,.08);color:var(--dim);box-shadow:none;cursor:not-allowed}

.dock.off .field{opacity:.45}

/* bezel details */
.panel-row{
  position:absolute;left:22px;right:22px;bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
}

.logo-plate{
  font-family:'Unbounded',sans-serif;
  font-size:11px;font-weight:600;letter-spacing:.22em;
  color:rgba(255,255,255,.55);
}

.knobs{display:flex;gap:10px;align-items:center}

.knob{
  width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#9d8fe0,#3a2d7a 70%);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.4);
  position:relative;
}

.knob::after{
  content:'';position:absolute;top:4px;left:50%;
  width:2px;height:8px;margin-left:-1px;border-radius:2px;
  background:rgba(255,255,255,.7);
}

.knob.k2::after{transform:rotate(55deg);transform-origin:50% 9px}

.led{
  width:8px;height:8px;border-radius:50%;
  background:#3CFF9E;box-shadow:0 0 10px #3CFF9E;
}

.stand{
  width:44%;height:16px;margin:0 auto;
  background:linear-gradient(180deg,#2b1f5e,#140d33);
  border-radius:0 0 18px 18px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
}

.honey{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

footer{margin-top:28px;font-size:12px;color:var(--dim);letter-spacing:.06em;text-align:center}
footer a{color:var(--mut);text-decoration:none}

@media(prefers-reduced-motion:reduce){
  .grid,.screen::after,.status .rec i,.typing .bubble span{animation:none!important}
}
</style>
</head>

/* ======================================================= */

const PROFILE = "https://x.com/" + CONFIG.xHandle;
const MISSIONS = [
  { key:"follow", icon:"👤", text:"Follow @fomorians_",       url:"https://x.com/intent/follow?screen_name=" + CONFIG.xHandle },
  { key:"like",   icon:"♥",  text:"Like the latest post",    url:CONFIG.latestPost },
  { key:"rt",     icon:"⟲",  text:"Repost the latest post",  url:CONFIG.latestPost },
  { key:"notif",  icon:"🔔", text:"Turn on notifications",   url:PROFILE },
];

const HAND = /^@?[A-Za-z0-9_]{1,15}$/;
const EVM  = /^[a-fA-F0-9]{40}$/;

const $ = id => document.getElementById(id);
const chat = $("chat"), inp = $("inp"), ok = $("ok"), dock = $("dock"), pre = $("pre");

let stage = "intro";           // intro → handle → missions → wallet → done
let handle = "";
const done = {};
let lastBotAv = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };

/* ---------- sending ---------- */
// Try fetch first. If a browser, in-app webview or blocker rejects it,
// fall back to a classic hidden form POST into an iframe.
function postViaIframe(fields){
  return new Promise(resolve => {
    const name = "gf_" + Date.now();
    const frame = document.createElement("iframe");
    frame.name = name;
    frame.style.display = "none";
    document.body.appendChild(frame);

    const form = document.createElement("form");
    form.action = CONFIG.formAction;
    form.method = "POST";
    form.target = name;
    form.style.display = "none";
    Object.entries(fields).forEach(([k,v]) => {
      const i = document.createElement("input");
      i.type = "hidden"; i.name = k; i.value = v;
      form.appendChild(i);
    });
    document.body.appendChild(form);

    let finished = false;
    const finish = () => { if (finished) return; finished = true; setTimeout(() => { form.remove(); frame.remove(); }, 1000); resolve(); };
    frame.addEventListener("load", finish);
    setTimeout(finish, 3000);
    form.submit();
  });
}

async function sendToForm(fields){
  const body = new FormData();
  Object.entries(fields).forEach(([k,v]) => body.append(k, v));
  try {
    await fetch(CONFIG.formAction, { method:"POST", mode:"no-cors", body });
  } catch(e){
    await postViaIframe(fields);
  }
}

/* ---------- rendering ---------- */
function avatar(){
  const a = document.createElement("div");
  a.className = "av";
  a.innerHTML = '<img src="' + CONFIG.avatar + '" alt="">';
  return a;
}

function botRow(extra){
  // only the last consecutive bot bubble shows the avatar
  if (lastBotAv) lastBotAv.classList.add("ghost");
  const row = document.createElement("div");
  row.className = "msg bot" + (extra ? " " + extra : "");
  const av = avatar();
  row.appendChild(av);
  lastBotAv = av;
  return row;
}

async function typing(ms){
  const row = botRow("typing");
  row.innerHTML += '<div class="bubble"><span></span><span></span><span></span></div>';
  chat.appendChild(row); scrollDown();
  await sleep(ms);
  row.remove();
  lastBotAv = null;
  // restore avatar on the previous bot message
  const bots = chat.querySelectorAll(".msg.bot .av");
  if (bots.length){ const last = bots[bots.length-1]; last.classList.remove("ghost"); lastBotAv = last; }
}

async function say(html, opts = {}){
  await typing(opts.wait ?? 650 + Math.min(html.length * 8, 900));
  const row = botRow(opts.err ? "err" : "");
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = html;
  row.appendChild(b);
  chat.appendChild(row); scrollDown();
  return b;
}

function reply(text){
  lastBotAv = null;
  const row = document.createElement("div");
  row.className = "msg me";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  chat.appendChild(row); scrollDown();
}

function openDock(prefix, placeholder){
  pre.textContent = prefix;
  inp.value = "";
  inp.placeholder = placeholder;
  inp.disabled = false;
  ok.disabled = false;
  dock.classList.remove("off");
  setTimeout(() => inp.focus({preventScroll:true}), 50);
}

function closeDock(placeholder){
  inp.value = "";
  inp.placeholder = placeholder || "Waiting…";
  inp.disabled = true;
  ok.disabled = true;
  dock.classList.add("off");
}

/* ---------- script ---------- */
async function intro(){
  await sleep(400);
  await say("Hey traveler 👋 I'm a <span class='hl'>Fomorian</span>.");
  await say("Let's get you on the whitelist. First, what's your <b>X username</b>?");
  stage = "handle";
  openDock("@", "your X username");
}

async function onHandle(v){
  if (!HAND.test(v)){
    reply(v || "…");
    closeDock();
    await say("Hmm, that doesn't look right. Use letters, numbers and _ only, max 15 characters. Try again 👇", {err:true});
    openDock("@", "your X username");
    return;
  }
  handle = v.replace(/^@/, "");
  reply("@" + handle);
  closeDock("Complete the missions above");
  stage = "missions";

  await say("Nice to meet you, <span class='hl'>@" + handle + "</span> 🤝");
  const b = await say("Now complete these <b>4 missions</b>. Tap <b>Go</b>, do it on X, then come back and tap <b>Done?</b>");
  renderMissions(b);
}

function renderMissions(bubble){
  const wrap = document.createElement("div");
  wrap.className = "missions";

  MISSIONS.forEach(m => {
    const row = document.createElement("div");
    row.className = "mission";
    row.innerHTML =
      '<div class="mi">' + m.icon + '</div>' +
      '<div class="mt">' + m.text + '</div>' +
      '<button type="button">Go</button>';
    const btn = row.querySelector("button");

    btn.addEventListener("click", () => {
      if (done[m.key]) return;
      if (btn.dataset.opened !== "1"){
        window.open(m.url, "_blank", "noopener");
        btn.dataset.opened = "1";
        btn.textContent = "Done?";
        return;
      }
      done[m.key] = true;
      row.classList.add("done");
      row.querySelector(".mi").textContent = "✓";
      btn.textContent = "✓";
      checkMissions();
    });

    wrap.appendChild(row);
  });

  bubble.appendChild(wrap);
  scrollDown();
}

async function checkMissions(){
  const count = MISSIONS.filter(m => done[m.key]).length;
  if (count < MISSIONS.length || stage !== "missions") return;
  stage = "wallet-wait";
  await say("All missions complete 🔥");
  await say("Last step — paste your <b>EVM wallet address</b> on <span class='hl'>Robinhood Chain</span>. This is the wallet that gets whitelisted.");
  stage = "wallet";
  openDock("0x", "wallet address");
}

async function onWallet(v){
  const raw = v.startsWith("0x") ? v.slice(2) : v;
  if (!EVM.test(raw)){
    reply(v || "…");
    closeDock();
    await say("That address doesn't look valid. It should be <b>0x</b> + 40 characters. Copy it straight from your wallet 👇", {err:true});
    openDock("0x", "wallet address");
    return;
  }
  const wallet = "0x" + raw;
  reply(wallet.slice(0,6) + "…" + wallet.slice(-4));
  closeDock("Transmitting…");
  stage = "sending";

  if ($("website").value) return;

  await say("Transmitting to the realm… 📡", {wait:500});

  try {
    await sendToForm({ [CONFIG.entryHandle]: handle, [CONFIG.entryWallet]: wallet });
    stage = "done";
    await say("✅ You're on the list, <span class='hl'>@" + handle + "</span>!");
    await say("Keep notifications on for <b>@fomorians_</b> — the mint drops there. See you on the other side 🌑");
    closeDock("You're whitelisted ✓");
  } catch(e){
    stage = "wallet";
    await say("Signal lost 📡 Connection error — try sending your address again.", {err:true});
    openDock("0x", "wallet address");
  }
}

/* ---------- input ---------- */
async function submit(){
  if (ok.disabled) return;
  const v = inp.value.trim();
  if (!v) { inp.focus(); return; }
  if (stage === "handle") return onHandle(v);
  if (stage === "wallet") return onWallet(v);
}

ok.addEventListener("click", submit);
inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

intro();
</script>
